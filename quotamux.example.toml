# QuotaMux version-four routing workspace configuration.
# Copy this file to quotamux.toml and keep the populated file private.
config_version = 4

[server]
# Docker publishes this port on 127.0.0.1; QuotaMux listens on all container
# interfaces so OrbStack can forward the host port.
listen = "0.0.0.0:8080"
data_dir = "./data"
# Limit the encoded JSON body (including Base64 image expansion) while leaving
# enough headroom for the provider's default multimodal request budget.
max_inference_body_bytes = 33554432

# Active upstream streams may legitimately pause during long reasoning. Keep
# their idle-read deadline separate from ordinary responses and from the total
# request deadline. QuotaMux emits downstream SSE comments while it waits.
[server.timeouts]
upstream_connect_ms = 10000
upstream_read_ms = 90000
upstream_stream_read_ms = 300000
upstream_total_ms = 7200000
downstream_sse_heartbeat_ms = 15000
# When every remaining route is waiting on an in-flight half-open probe, wait
# briefly for that probe to settle before returning a retryable 503.
route_probe_wait_ms = 5000

# Prefix affinity metadata is process-local and never written to redb.
[affinity]
checkpoint_bytes = 128
max_checkpoints_per_path = 4096
max_candidates_per_prefix = 8
max_leases = 16384
success_ttl_ms = 300000

# Backend definitions use exact upstream model IDs. Official adapters own their
# endpoint; choose a custom-* adapter when supplying a customer URL.
[[backends]]
id = "opencode-go"
adapter = "opencode-go"

[[backends.credentials]]
id = "go-plan"
api_key = ""

[[backends.models]]
name = "deepseek-v4.1-flash"
protocols = []
pricing_note = "OpenCode Go: listed $10/month subscription. USD rates value quota usage, not an additional cash invoice. DeepSeek weekday peak 01:00-04:00 and 06:00-10:00 UTC; GLM-5.3-Flash uses its static published rate. V4.1 Flash rates verified 2026-09-11."
pricing_source = "https://opencode.ai/docs/go/"

[backends.models.pricing]
cache_hit_input_usd_per_million = 0.003
cache_miss_input_usd_per_million = 0.15
output_usd_per_million = 0.6

[backends.models.pricing_schedule]
timezone = "UTC"

[[backends.models.pricing_schedule.windows]]
name = "Weekday morning peak"
days = [
    1,
    2,
    3,
    4,
    5,
]
start = "01:00"
end = "04:00"

[backends.models.pricing_schedule.windows.pricing]
cache_hit_input_usd_per_million = 0.006
cache_miss_input_usd_per_million = 0.3
output_usd_per_million = 1.2

[[backends.models.pricing_schedule.windows]]
