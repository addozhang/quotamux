# QuotaMux owns this public model name and its explicit compatibility alias.
[[models]]
name = "deepseek-v4-flash-0731"
aliases = ["deepseek-v4-flash"]
protocols = ["openai-chat", "openai-responses", "anthropic-messages"]

# Layers are attempted in order. One target skips random/affinity work.
# Use strategy = "prompt-prefix-affinity" when a layer has multiple equivalent
# cache domains; the current single-target layer intentionally stays random.
[[models.layers]]
name = "plan"
strategy = "random"
targets = [
  { backend = "opencode-go", credential = "go-plan", model = "deepseek-v4-flash" },
]

[[models.layers]]
name = "payg"
strategy = "random"
targets = [
  { backend = "deepseek", credential = "deepseek-payg", model = "deepseek-v4-flash" },
]

[[models]]
