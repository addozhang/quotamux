# GitHub Copilot. Obtain the token once with the device-flow helper and paste
# it below; it does not expire.
#   cargo run --bin quotamux-copilot-login
[[backends]]
id = "copilot"
adapter = "github-copilot"

[[backends.credentials]]
id = "copilot-token"
api_key = ""

[[backends.models]]
# Set the exact model IDs enabled on your Copilot plan:
#   curl -H "Authorization: Bearer $TOKEN" https://api.githubcopilot.com/models
# The adapter owns each model's endpoint through its official catalog, so
# `protocols` can be omitted: the GPT models use Responses, Gemini and the
# Kimi Copilot models use Chat, and Claude models keep the native Anthropic
# endpoint. Declare `protocols` only to narrow that catalog or to enable a
# model the catalog does not list.
# default_thinking_level (off/low/medium/high/xhigh/max) applies when the
# request carries no reasoning parameter.
name = "gpt-6-sol"
default_thinking_level = "medium"

