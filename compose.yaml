services:
  quotamux:
    build:
      context: .
    image: ${QUOTAMUX_IMAGE:-quotamux:local}
    container_name: ${QUOTAMUX_CONTAINER:-quotamux}
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      QUOTAMUX_DATA_DIR: /data
      RUST_LOG: quotamux=info
    ports:
      - "${QUOTAMUX_PORT:-8080}:8080"
    volumes:
      - ${QUOTAMUX_CONFIG_DIR:-./data/routing}:/config
      - quotamux-data:/data
volumes:
  quotamux-data:
    name: ${QUOTAMUX_DATA_VOLUME:-quotamux_quotamux-data}
